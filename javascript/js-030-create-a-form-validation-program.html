<div class="demo"><form id='form'><input id='name' placeholder='Name' required><input id='email' type='email' placeholder='Email' required><input id='phone' placeholder='Phone' required><input id='password' type='password' placeholder='Password' minlength='6' required><button>Validate</button></form><div id='out' class='output'></div><script>form.addEventListener('submit',e=>{e.preventDefault();out.textContent=form.checkValidity()?'Form is valid!':'Please correct the fields.'})</script></div>
