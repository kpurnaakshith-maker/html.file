<h2>Write a program to check whether a number is prime.</h2>
<p class="muted">Write a program to check whether a number is prime.</p>
</section>
<div class="demo"><input id='num' type='number' value='29'><button onclick="let n=+num.value,p=n>1;for(let i=2;i*i<=n;i++)if(n%i===0)p=false;out.textContent=p?'Prime':'Not prime'">Check</button><div id='out' class='output'></div></div>
