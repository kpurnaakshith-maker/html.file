<div class="demo"><input id='pw' type='password' placeholder='Enter password'><div id='out' class='output'></div><script>pw.addEventListener('input',()=>{let s=pw.value,score=(s.length>=8)+(\/[A-Z]\/).test(s)+(\/[0-9]\/).test(s)+(\W/.test(s));out.textContent=['Very weak','Weak','Medium','Strong','Very strong'][score]})</script></div>
