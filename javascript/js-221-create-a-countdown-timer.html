<div class="demo"><input id='seconds' type='number' value='10' min='1'><button onclick="let n=+seconds.value;clearInterval(window.cd);clock.textContent=n;window.cd=setInterval(()=>{n--;clock.textContent=n;if(n<=0){clearInterval(window.cd);clock.textContent='Time up!'}},1000)">Start</button><div id='clock' class='output'></div></div>
