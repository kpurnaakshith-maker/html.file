<div class="demo"><input id='data' placeholder='Temporary value'><button onclick="sessionStorage.setItem('sessionData',data.value);out.textContent='Saved for this session.'">Save</button><button onclick="out.textContent=sessionStorage.getItem('sessionData')||'No data'">Read</button><div id='out' class='output'></div></div>
