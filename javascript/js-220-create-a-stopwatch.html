<div class="demo"><div id='display' style='font-size:2rem'>00:00.0</div><button id='start'>Start</button> <button id='stop'>Stop</button> <button id='reset'>Reset</button><script>let st,ms=0;function render(){let s=Math.floor(ms/1000),d=Math.floor((ms%1000)/100);display.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}.${d}`}start.onclick=()=>{if(!st)st=setInterval(()=>{ms+=100;render()},100)};stop.onclick=()=>{clearInterval(st);st=null};reset.onclick=()=>{clearInterval(st);st=null;ms=0;render()}</script></div>
