<div class="demo"><div id='drag' draggable='true' style='padding:25px;background:#bfdbfe;width:180px'>Drag me</div><div id='drop' style='padding:40px;border:2px dashed #2563eb;margin-top:15px'>Drop here</div><div id='out' class='output'></div><script>drag.ondragstart=e=>e.dataTransfer.setData('text','x');drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();out.textContent='Dropped successfully!'}</script></div>
