<div class="demo"><input id='num' type='number' min='1' value='8'><button onclick="let n=+num.value,a=0,b=1,s=[];for(let i=0;i<n;i++){s.push(a);[a,b]=[b,a+b]}out.textContent=s.join(', ')">Generate</button><div id='out' class='output'></div></div>
